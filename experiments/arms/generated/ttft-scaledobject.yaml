apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sim-ttft
  namespace: serving
spec:
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 0
  cooldownPeriod: 300
  maxReplicaCount: 6
  minReplicaCount: 1
  pollingInterval: 30
  scaleTargetRef:
    name: llm-sim
  triggers:
  - metadata:
      activationThreshold: '0.05'
      query: histogram_quantile(0.95, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket{namespace="serving"}[2m])))
      serverAddress: http://mon-kube-prometheus-stack-prometheus.monitoring.svc:9090
      threshold: '0.42'
    type: prometheus
