apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sim-cpu
  namespace: serving
spec:
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 0
  cooldownPeriod: 300
  maxReplicaCount: 6
  minReplicaCount: 1
  pollingInterval: 30
  scaleTargetRef:
    name: llm-sim
  triggers:
  - metadata:
      activationThreshold: '0.05'
      query: sum(rate(container_cpu_usage_seconds_total{namespace="serving",container="sim"}[2m]))
      serverAddress: http://mon-kube-prometheus-stack-prometheus.monitoring.svc:9090
      threshold: '0.025'
    type: prometheus
