# experiments/sim/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: llm-sim
  namespace: serving
  labels: {app: llm-sim}
spec:
  type: NodePort
  selector: {app: llm-sim}
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-sim
  namespace: serving
  labels: {release: mon}        # match the helm release so the stack picks it up
spec:
  selector: {matchLabels: {app: llm-sim}}
  endpoints:
    - port: http
      interval: 15s
