# experiments/config/frozen.yaml — THE numeric source of truth. Candidate
# values now; Task 11 sets calibrated: true with measured numbers. Any change
# here is a visible git diff on the record.
calibrated: true
sim:                       # starting points; frozen by Task 11
  max_num_seqs: 8
  ttft_base_ms: 200
  itl_base_ms: 40
  time_factor_under_load: 3.0
  kv_cache_blocks:         # ×16 tokens/replica. Sim rejects (4xx) requests that
                           # don't fit FREE KV under concurrency; per-pattern
                           # sizing keeps 8 concurrent admitted in both mixes
                           # (measured 2026-09-05, notes/signal_liveness.md):
    baseline: 140          # 2240-token KV; 256/128 full load -> 0.85 occupancy
    longctx: 1024          # 16384-token KV; 1536/384 bursts -> 0.92 occupancy
  max_model_len: 4096
capacity:
  cap_rps: 0.5             # measured 2026-09-05 clean sweep (verified drains,
                           # results/calibration/clean_*.json): waiting stays 0
                           # through 0.5, first sustained queue at 0.625;
                           # throughput ceiling 0.458 rps
slo:                       # frozen 2026-09-05; low-load p95 baselines x multipliers
  ttft_baseline_s: 0.28    # p95 @ 0.125 rps clean (clean_0.125.json)
  tpot_baseline_s: 0.041   # p95 @ 0.125 rps clean
  ttft_target_mult: 1.5
  tpot_target_mult: 2.0
thresholds:                # per-arm KEDA thresholds (Task 11 calibrates)
  cpu_cores_per_replica: 0.025  # calibrated: full-load per-replica sim cpu
                                # measured ~0.035 cores (latency simulator,
                                # not compute-bound); 0.025 ≈ 70% of that —
                                # the plan's 0.35 candidate was 10x too high
  rps_per_replica: 0.5     # = cap_rps
  queue_per_replica: 5
  kv_frac: 0.70
  ttft_p95_s: 0.42         # = ttft_baseline_s * 1.5 (= SLO target; arm scales at the boundary)
  composite_kv_frac: 0.80  # WVA threshold-OR tau_kv (paper §V-A; repo default)
  composite_queue: 5       # WVA threshold-OR tau_q (paper §V-A; repo default)
  cpu_activation: 0.05
  rps_activation: 0.5
  queue_activation: 1
  kv_activation: 0.1
  ttft_activation: 0.05
headroom:
  node_cpu_limit: 0.70
replicas: {min: 1, max: 6}
composite:                  # reference condition, NOT a treatment arm (spec §6.2)
  role: reference
  excluded_from_ranking: true
  semantics: max_over_triggers   # KEDA multi-trigger max == WVA threshold-OR
  thresholds_source: "WVA paper §V-A (arXiv:2603.09730v2) + llm-d-workload-variant-autoscaler deploy/configmap-saturation-scaling.yaml"
  deviation_note: null      # Task 11: set if a WVA threshold proves inert on this host
timing:                     # spec §6.3 — identical across arms; recorded for
                             # the run fingerprint so every metrics.json carries it
  keda_polling_interval_s: 30      # DEVIATION (KEDA 2.20, min>=1): warning says
                             # pollingInterval is ignored unless min/idle=0 or
                             # useCachedMetrics — effective evaluation cadence is
                             # the HPA sync period below. Uniform across arms.
  keda_cooldown_period_s: 300      # inert at min=1 (KEDA 2.20 confirms)
  hpa_sync_period_s: 15            # k3s default, unmodified — the real loop rate
  hpa_scale_down_stabilization_s: 300   # the 1→N downscale dampener
  hpa_scale_up_stabilization_s: 0
