# experiments/cluster/monitoring-values.yaml — slim kube-prometheus-stack.
grafana:
  enabled: false
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
defaultRules:
  create: false
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    retention: 2d
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 768Mi}
  service:
    type: NodePort
    nodePort: 30090
